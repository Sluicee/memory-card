name: "publish"

on:
  push:
    branches:
      - master
    tags:
      - "v*"

jobs:
  publish:
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        platform: [macos-latest, ubuntu-22.04, windows-latest]

    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4

      - name: setup node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Rust cache
        uses: swatinem/rust-cache@v2

      - name: install dependencies (ubuntu only)
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-dev libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev libasound2-dev

      - name: install frontend dependencies
        run: npm install

      - name: check types
        run: npm run check

      - name: setup sidecar ffmpeg
        shell: bash
        run: |
          npm install --no-save ffmpeg-static
          cat << 'EOF' > setup-sidecar.js
          import fs from 'fs';
          import { dirname, join } from 'path';
          import ffmpegRaw from 'ffmpeg-static';
          const ffmpeg = ffmpegRaw.default || ffmpegRaw;
          
          const platform = process.platform;
          let target = '';
          if (platform === 'darwin') target = 'aarch64-apple-darwin';
          else if (platform === 'linux') target = 'x86_64-unknown-linux-gnu';
          else target = 'x86_64-pc-windows-msvc';
          
          const ext = platform === 'win32' ? '.exe' : '';
          const dest = join('src-tauri', 'binaries', `ffmpeg-${target}${ext}`);
          
          fs.mkdirSync(dirname(dest), { recursive: true });
          try {
            fs.unlinkSync(dest);
          } catch (e) {}
          console.log(`Copying FFmpeg to ${dest}`);
          fs.copyFileSync(ffmpeg, dest);
          EOF
          node setup-sidecar.js

      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Signs the updater artifacts (.sig files next to each installer).
          # Without these the build fails, because tauri.conf.json enables
          # createUpdaterArtifacts.
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tagName: v__VERSION__ # tauri-action automatically replaces this with the version from tauri.conf.json
          releaseName: "Memory Card v__VERSION__"
          # Notes for the release being cut — update this together with the
          # version bump, it is not generated from anything.
          releaseBody: |
            ## Memory Card 2.0

            ### New

            - **Clips** — a music-video tab that scans its own folder and plays videos in-window or fullscreen. Streamed locally through the bundled FFmpeg sidecar (remuxed when the codec is already playable, transcoded to WebM otherwise), so there is nothing to install alongside it.
            - **Equalizer** — per-band gain with a preamp, applied through FFmpeg audio filters.
            - **Gamepad navigation** — move through the album grid, lists and menus with a controller.
            - **In-app updates** — new releases are offered from the options menu and install in place on Windows, macOS and Linux (AppImage, `.deb`, `.rpm`).
            - **Queue management** — remove single entries from the queue or clear it outright.
            - **Album sorting modes**, with the sort and page position kept between sessions.

            ### Improved

            - More robust metadata scanning: lofty 0.24, a symphonia duration fallback and filename parsing for untagged files.
            - Faster clip start-up and seeking, and thumbnail generation no longer saturates every core.
            - Hardware-accelerated video on Linux, plus steadier fullscreen behaviour on Wayland.
            - Fixed listening-stats inflation; existing stats are repaired once from the history logs on first launch.
            - Fixed an equalizer glitch when switching tracks, and the EQ now applies correctly at startup.

            ### Note for 1.4.0 users

            The in-app updater ships **with** this release, so 2.0 itself has to be installed manually — updates from 2.0 onwards are offered inside the app.

            See the assets below for the installers.
          releaseDraft: true # kept as draft here so the release doesn't go public/trigger AUR publishing until every platform in the matrix has uploaded its assets — see finalize-release below
          prerelease: false
          # Each matrix job would otherwise upload its own latest.json and race
          # the other two for the same asset, so a platform can silently go
          # missing from the manifest. finalize-release builds it once instead,
          # from the .sig files all three jobs have finished uploading.
          includeUpdaterJson: false

  finalize-release:
    name: Publish release
    needs: publish # only runs once every matrix platform above has finished successfully, so all installers are already attached
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      # The updater endpoint is a plain file on the release:
      # .../releases/latest/download/latest.json. Build it from the signatures
      # every platform uploaded, so it can never disagree with the assets that
      # are actually there.
      - name: Build updater manifest (latest.json)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          VERSION=$(node -p "require('./src-tauri/tauri.conf.json').version")
          TAG="v$VERSION"

          # The plugin looks up `{os}-{arch}-{installer}` first and falls back to
          # `{os}-{arch}`, where {installer} is baked into the running binary by
          # the bundler. That marker only exists on Linux, so deb and rpm get
          # explicit keys and everything else rides the bare fallback.
          key_for() {
            case "$1" in
              # bundle.targets no longer builds MSI (the updater can't tell an
              # MSI install from an NSIS one, so it would install NSIS over it);
              # this stays as a guard in case the target ever comes back.
              *.msi)          echo "" ;;
              *.exe)          echo "windows-x86_64" ;;
              *.AppImage)     echo "linux-x86_64" ;;
              *.deb)          echo "linux-x86_64-deb" ;;
              *.rpm)          echo "linux-x86_64-rpm" ;;
              *.app.tar.gz)
                case "$1" in
                  *x64*|*x86_64*) echo "darwin-x86_64" ;;
                  *)              echo "darwin-aarch64" ;;  # CI builds macOS on Apple Silicon only
                esac ;;
              *) echo "" ;;
            esac
          }

          # Every asset of these kinds must end up in the manifest. If one loses
          # its signature (renamed artifact, signing skipped), the release would
          # otherwise ship a manifest that silently strands that install type.
          mapfile -t ASSETS < <(gh release view "$TAG" --repo "$REPO" --json assets -q '.assets[].name')

          mkdir -p sigs && cd sigs
          # Non-zero when the release carries no .sig at all; the checks below
          # report that far more clearly than gh's own error.
          gh release download "$TAG" --repo "$REPO" --pattern '*.sig' || true

          platforms='{}'
          missing=()
          for asset in "${ASSETS[@]}"; do
            key=$(key_for "$asset")
            [ -n "$key" ] || continue
            if [ ! -f "$asset.sig" ]; then
              missing+=("$asset")
              continue
            fi
            url="https://github.com/$REPO/releases/download/$TAG/$(jq -rn --arg s "$asset" '$s|@uri')"
            platforms=$(jq --arg k "$key" --arg sig "$(cat "$asset.sig")" --arg url "$url" \
              '.[$k] = {signature: $sig, url: $url}' <<< "$platforms")
            echo "$key -> $asset"
          done

          if [ ${#missing[@]} -gt 0 ]; then
            echo "::error::updater artifacts without a signature on $TAG: ${missing[*]}"
            exit 1
          fi

          # One bare key per matrix platform: proof all three jobs contributed.
          for key in windows-x86_64 darwin-aarch64 linux-x86_64; do
            if [ "$(jq --arg k "$key" 'has($k)' <<< "$platforms")" != "true" ]; then
              echo "::error::no updater artifact for $key on $TAG"
              exit 1
            fi
          done

          jq -n --arg v "$VERSION" \
                --arg d "$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
                --arg n "Memory Card $TAG" \
                --argjson p "$platforms" \
                '{version: $v, notes: $n, pub_date: $d, platforms: $p}' > latest.json
          cat latest.json

          gh release upload "$TAG" latest.json --clobber --repo "$REPO"

      - name: Un-draft the release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          VERSION=$(node -p "require('./src-tauri/tauri.conf.json').version")
          gh release edit "v$VERSION" --draft=false --repo "${{ github.repository }}"

