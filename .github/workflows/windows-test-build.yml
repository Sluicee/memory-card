name: "windows-test-build"

on:
  workflow_dispatch:
  push:
    branches:
      - dev
    paths:
      - ".github/workflows/windows-test-build.yml"

jobs:
  build:
    name: Build Windows (manual test artifact)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: setup node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Rust cache
        uses: swatinem/rust-cache@v2

      - name: install frontend dependencies
        run: npm install

      - name: check types
        run: npm run check

      - name: setup sidecar ffmpeg
        shell: bash
        run: |
          npm install --no-save ffmpeg-static
          cat << 'EOF' > setup-sidecar.js
          import fs from 'fs';
          import { dirname, join } from 'path';
          import ffmpegRaw from 'ffmpeg-static';
          const ffmpeg = ffmpegRaw.default || ffmpegRaw;

          const platform = process.platform;
          let target = '';
          if (platform === 'darwin') target = 'aarch64-apple-darwin';
          else if (platform === 'linux') target = 'x86_64-unknown-linux-gnu';
          else target = 'x86_64-pc-windows-msvc';

          const ext = platform === 'win32' ? '.exe' : '';
          const dest = join('src-tauri', 'binaries', `ffmpeg-${target}${ext}`);

          fs.mkdirSync(dirname(dest), { recursive: true });
          try {
            fs.unlinkSync(dest);
          } catch (e) {}
          console.log(`Copying FFmpeg to ${dest}`);
          fs.copyFileSync(ffmpeg, dest);
          EOF
          node setup-sidecar.js

      - name: build app
        run: npx tauri build
        env:
          # Bundling signs the updater artifacts, so even this throwaway build
          # needs the key (see createUpdaterArtifacts in tauri.conf.json).
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}

      - name: upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: memory-card-windows-test-build
          path: |
            src-tauri/target/release/bundle/nsis/*.exe
            src-tauri/target/release/*.exe
          retention-days: 14
