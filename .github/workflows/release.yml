name: "publish"

on:
  push:
    branches:
      - master
    tags:
      - "v*"

jobs:
  publish:
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        platform: [macos-latest, ubuntu-22.04, windows-latest]

    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4

      - name: setup node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: install dependencies (ubuntu only)
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-dev libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev libasound2-dev

      - name: install frontend dependencies
        run: npm install

      - name: check types
        run: npm run check

      - name: setup sidecar ffmpeg
        shell: bash
        run: |
          npm install --no-save ffmpeg-static
          cat << 'EOF' > setup-sidecar.js
          import fs from 'fs';
          import { dirname, join } from 'path';
          import ffmpegRaw from 'ffmpeg-static';
          const ffmpeg = ffmpegRaw.default || ffmpegRaw;
          
          const platform = process.platform;
          let target = '';
          if (platform === 'darwin') target = 'aarch64-apple-darwin';
          else if (platform === 'linux') target = 'x86_64-unknown-linux-gnu';
          else target = 'x86_64-pc-windows-msvc';
          
          const ext = platform === 'win32' ? '.exe' : '';
          const dest = join('src-tauri', 'binaries', `ffmpeg-${target}${ext}`);
          
          fs.mkdirSync(dirname(dest), { recursive: true });
          try {
            fs.unlinkSync(dest);
          } catch (e) {}
          console.log(`Copying FFmpeg to ${dest}`);
          fs.copyFileSync(ffmpeg, dest);
          EOF
          node setup-sidecar.js

      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: v__VERSION__ # tauri-action automatically replaces this with the version from tauri.conf.json
          releaseName: "Memory Card v__VERSION__"
          releaseBody: "See the assets below for the installers."
          releaseDraft: true
          prerelease: false

  publish-aur:
    needs: publish
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - name: Set up SSH key
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.AUR_SSH_PRIVATE_KEY }}

      - name: Clone AUR package repository
        run: |
          mkdir -p ~/.ssh
          ssh-keyscan -h aur.archlinux.org >> ~/.ssh/known_hosts
          git clone ssh://aur@aur.archlinux.org/memory-card-bin.git aur-repo

      - name: Download release asset & update AUR package
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          echo "Updating AUR package to version $VERSION"

          # Download the built .deb package from the release
          gh release download "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --pattern "*.deb" --dir /tmp/deb
          DEB_FILE=$(ls /tmp/deb/*.deb | head -n 1)
          SHA256=$(sha256sum "$DEB_FILE" | awk '{print $1}')
          echo "Calculated SHA256: $SHA256"

          cd aur-repo
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          # Update PKGBUILD
          sed -i "s/^pkgver=.*/pkgver=$VERSION/" PKGBUILD
          sed -i "s/^pkgrel=.*/pkgrel=1/" PKGBUILD
          sed -i "s/sha256sums=.*/sha256sums=('$SHA256')/" PKGBUILD

          # Update .SRCINFO
          sed -i "s/pkgver = .*/pkgver = $VERSION/" .SRCINFO
          sed -i "s/memory-card-bin-.*\.deb/memory-card-bin-$VERSION.deb/" .SRCINFO
          sed -i "s|v.*/Memory.Card_.*_amd64.deb|v$VERSION/Memory.Card_${VERSION}_amd64.deb|" .SRCINFO
          sed -i "s/sha256sums = .*/sha256sums = $SHA256/" .SRCINFO

          git add PKGBUILD .SRCINFO
          if git diff --staged --quiet; then
            echo "No changes to commit."
          else
            git commit -m "Update to $VERSION"
            git push origin master
          fi

